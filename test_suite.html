<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HIRNA Automated Test Suite</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script>
        // Pre-seed an active SuperAdmin session
        localStorage.setItem('hirna_auth_user', JSON.stringify({
            email: "superadmin@hirna.ph",
            name: "SuperAdmin Hirna",
            role: "superadmin",
            roleTitle: "SuperAdmin (Full Access)"
        }));
    </script>
    <script src="assets/js/supabase-config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/payments.js"></script>
    <script src="assets/js/crm.js"></script>
    <script src="assets/js/audit.js"></script>
    <script src="assets/js/sso-gateway.js"></script>
</head>
<body style="font-family: monospace; padding: 20px; background: #0f172a; color: #f8fafc;">
    <h1>HIRNA Test Suite Execution</h1>
    <input type="text" id="test-sample-input" placeholder="Testing input visibility">
    <div id="test-output">Running tests...</div>

    <script>
        const results = [];
        function assert(cond, name, details = "") {
            if (cond) {
                results.push(`[PASS] ${name}`);
            } else {
                results.push(`[FAIL] ${name} ${details ? ': ' + details : ''}`);
            }
        }

        async function runTests() {
            try {
                // TEST 1: Form Input Visibility
                const sampleInput = document.getElementById('test-sample-input');
                const compStyle = window.getComputedStyle(sampleInput);
                const bWidth = compStyle.borderWidth;
                const bStyle = compStyle.borderStyle;
                assert(bWidth !== "0px" && bStyle === "solid", "Universal high-contrast solid input border is applied", `border: ${bWidth} ${bStyle}`);

                // TEST 2: Check Default Accounts & Passenger Naming
                const defaultAccs = AuthModule.defaultAccounts;
                const hasPassenger = defaultAccs.some(a => a.role === 'passenger' && a.email === 'passenger@hirna.ph' && a.password === 'passenger');
                assert(hasPassenger, "Default accounts include passenger@hirna.ph with role 'passenger' and password 'passenger'");

                const hasNoCustomerRole = !defaultAccs.some(a => a.role === 'customer');
                assert(hasNoCustomerRole, "No default accounts have role 'customer' (migrated to 'passenger')");

                // TEST 3: RBAC SuperAdmin
                const superAdminUser = defaultAccs.find(a => a.role === 'superadmin');
                AuthModule.currentUser = superAdminUser;
                assert(AuthModule.isSuperAdmin() === true, "isSuperAdmin() returns true for SuperAdmin");
                assert(AuthModule.isAdmin() === true, "isAdmin() returns true for SuperAdmin");
                assert(AuthModule.isPassenger() === false, "isPassenger() returns false for SuperAdmin");
                assert(AuthModule.canEditPasswords() === true, "SuperAdmin canEditPasswords() returns true");
                assert(AuthModule.canDeleteRecords() === true, "SuperAdmin canDeleteRecords() returns true");
                assert(AuthModule.canManageAccounts() === true, "SuperAdmin canManageAccounts() returns true");

                // TEST 4: Archive & Restore Functionality
                const testBooking = {
                    id: "TEST-BK-777",
                    booking_code: "HIRNA-TEST-777",
                    passenger_name: "Test Archiver",
                    service_type: "transport",
                    total_fare: 350.00,
                    payment_method: "GCash"
                };
                SupabaseBridge.insert('bookings', testBooking);

                // Verify present in active getData
                let activeList = SupabaseBridge.getData('bookings');
                assert(activeList.some(b => b.id === "TEST-BK-777"), "Record is initially returned by getData('bookings')");

                // Archive record
                const archRes = SupabaseBridge.archive('bookings', 'TEST-BK-777', 'Compliance Test Archival');
                assert(archRes === true, "SupabaseBridge.archive() returns true");

                // Verify record disappears from active getData
                activeList = SupabaseBridge.getData('bookings');
                assert(!activeList.some(b => b.id === "TEST-BK-777"), "Archived record is excluded from active getData('bookings')");

                // Verify record appears in getAllArchives()
                const allArch = SupabaseBridge.getAllArchives();
                const foundArch = allArch.find(a => a.id === "TEST-BK-777");
                assert(foundArch && foundArch.is_archived === true, "Archived record exists in getAllArchives() with is_archived: true");
                assert(foundArch && foundArch.archive_reason === 'Compliance Test Archival', "Archived record preserves archive_reason");

                // Restore record
                const restRes = SupabaseBridge.unarchive('bookings', 'TEST-BK-777');
                assert(restRes === true, "SupabaseBridge.unarchive() returns true");

                // Verify restored record returns to active getData
                activeList = SupabaseBridge.getData('bookings');
                assert(activeList.some(b => b.id === "TEST-BK-777"), "Restored record returns to active getData('bookings')");

                // TEST 5: Safe delete redirection to archive
                SupabaseBridge.delete('bookings', 'TEST-BK-777');
                const afterDeleteArch = SupabaseBridge.getAllArchives().find(a => a.id === "TEST-BK-777");
                assert(afterDeleteArch && afterDeleteArch.is_archived === true, "delete() safely redirects to archive() without permanent data loss");

                // TEST 6: Audit Log Recording for Archive Events
                const auditLogs = SupabaseBridge.getData('audit_logs');
                const hasArchiveAudit = auditLogs.some(l => l.event === 'RECORD_ARCHIVED' || l.event === 'RECORD_RESTORED');
                assert(hasArchiveAudit, "Compliance audit logs recorded for archival actions");

                // TEST 7: Account Provisioning with pin: null
                const newAcc = {
                    email: "test.staff@gmail.com",
                    name: "Test Staff",
                    role: "admin",
                    password: "password123",
                    pin: null
                };
                AuthModule.addOrUpdateAccount(newAcc);
                const retrievedAcc = AuthModule.accounts.find(a => a.email === "test.staff@gmail.com");
                assert(retrievedAcc !== undefined, "Newly added account is retrieved by AuthModule.accounts");
                assert(retrievedAcc.password === "password123", "Account password preserved");
                assert(retrievedAcc.pin === null, "Account pin explicitly initialized to null");

                // Clean up test account
                AuthModule.deleteAccount("test.staff@gmail.com");

                // TEST 8: Session Persistence
                AuthModule.setSession(superAdminUser);
                assert(localStorage.getItem('hirna_auth_user') !== null || sessionStorage.getItem('hirna_auth_user') !== null, "Session is stored permanently in storage");

                // TEST 9: Customer Navigation Filtering (Only Booking and Fare & Payments)
                const passengerUser = defaultAccs.find(a => a.role === 'passenger');
                AuthModule.currentUser = passengerUser;
                const dummySidebar = document.createElement('aside');
                dummySidebar.id = 'app-sidebar';
                document.body.appendChild(dummySidebar);
                AuthModule.renderSidebar();
                const passengerHtml = dummySidebar.innerHTML;
                assert(passengerHtml.includes('href="booking.html"'), "Customer sidebar includes Booking & Dispatch");
                assert(passengerHtml.includes('href="payments.html"'), "Customer sidebar includes Fare & Payments");
                assert(!passengerHtml.includes('href="main.html"'), "Customer sidebar excludes Dashboard");
                assert(!passengerHtml.includes('href="crm.html"'), "Customer sidebar excludes Customer CRM");
                assert(!passengerHtml.includes('href="gps.html"'), "Customer sidebar excludes GPS Telematics");
                assert(!passengerHtml.includes('href="analytics.html"'), "Customer sidebar excludes Fleet Analytics");
                assert(!passengerHtml.includes('href="audit.html"'), "Customer sidebar excludes SOP & Audit Logs");
                assert(!passengerHtml.includes('href="sso.html"'), "Customer sidebar excludes SuperAdmin SSO");

                // TEST 10: SuperAdmin Module Access
                AuthModule.currentUser = superAdminUser;
                AuthModule.renderSidebar();
                const superAdminHtml = dummySidebar.innerHTML;
                assert(superAdminHtml.includes('href="main.html"'), "SuperAdmin sidebar includes Dashboard");
                assert(superAdminHtml.includes('href="booking.html"'), "SuperAdmin sidebar includes Booking & Dispatch");
                assert(superAdminHtml.includes('href="payments.html"'), "SuperAdmin sidebar includes Fare & Payments");
                assert(superAdminHtml.includes('href="sso.html"'), "SuperAdmin sidebar includes SuperAdmin SSO");
                dummySidebar.remove();

            } catch (err) {
                results.push(`[ERROR] Exception during tests: ${err.message}\n${err.stack}`);
            }

            const outputEl = document.getElementById('test-output');
            outputEl.innerHTML = `<pre id="test-results">\n${results.join('\n')}\n</pre>`;
        }

        window.addEventListener('DOMContentLoaded', runTests);
    </script>
</body>
</html>
